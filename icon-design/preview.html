<!doctype html>
<html><head><meta charset="utf-8"><title>Icon preview</title>
<style>
  body { margin: 0; font: 14px -apple-system, system-ui, sans-serif; background: #f2f2f2; color: #222; }
  .design { display: grid; grid-template-columns: 300px 1fr; gap: 28px; padding: 28px 36px; border-bottom: 1px solid #ddd; align-items: center; }
  h2 { margin: 0 0 6px; font-size: 18px; }
  .big img { width: 300px; height: 300px; display: block; }
  .row { display: flex; gap: 26px; align-items: flex-end; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell small { color: #777; }
  /* iOS: the artwork alone (the squircle's 824 of 1024), masked by the system */
  .ios { width: 120px; height: 120px; border-radius: 22.5%; overflow: hidden; position: relative; }
  .ios img { position: absolute; width: calc(120px * 1024 / 824); left: calc(-120px * 100 / 824); top: calc(-120px * 100 / 824); }
  /* Android adaptive: the same artwork as the 108dp foreground; the launcher shows the middle 72dp */
  .android { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; position: relative; background: #fff; }
  .android img { position: absolute; width: calc(120px * 1024 / 824 * 1.5); left: calc(-120px * (1024 / 824 * 1.5 - 1) / 2); top: calc(-120px * (1024 / 824 * 1.5 - 1) / 2); }
  .dark { background: #1e1e1e; padding: 14px 18px; border-radius: 14px; display: flex; gap: 22px; align-items: flex-end; }
  .light { background: #fff; padding: 14px 18px; border-radius: 14px; display: flex; gap: 22px; align-items: flex-end; }
</style></head>
<body>
  <div class="design" data-src="out/c3d-light.png" data-name="C · 洞洞板 3D（白）"></div>
  <div class="design" data-src="out/c3d-dark.png" data-name="C · 洞洞板 3D（黑）"></div>
<script>
  for (const d of document.querySelectorAll('.design')) {
    const s = d.dataset.src;
    const sizes = [64, 32, 16].map(n => `<img src="${s}" width="${n}" height="${n}">`).join('');
    d.innerHTML = `
      <div class="big"><h2>${d.dataset.name}</h2><img src="${s}"></div>
      <div class="row">
        <div class="cell"><div class="ios"><img src="${s}"></div><small>iOS</small></div>
        <div class="cell"><div class="android"><img src="${s}"></div><small>Android (圆形裁切)</small></div>
        <div class="cell"><div class="light">${sizes}</div><small>64 / 32 / 16 · 浅色</small></div>
        <div class="cell"><div class="dark">${sizes}</div><small>64 / 32 / 16 · 深色</small></div>
      </div>`;
  }
</script>
</body></html>
