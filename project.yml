name: TwimShelf
options:
  bundleIdPrefix: org.twimshelf
  # English is the fallback for languages the app does not have; the catalogs hold zh-Hans, zh-Hant, ja too
  developmentLanguage: en
packages:
  # the MLX engine, shared with the Flutter app's Apple runner (it brings mlx-swift-lm and
  # swift-transformers)
  TLLocalAI: { path: native/TLLocalAI }
# The Xcode project is made from this file (scripts/apply.py runs XcodeGen; it is not in git).
# bundle ids, version, team, app groups, icon, share extensions: from config.yaml (scripts/apply.py)
configFiles:
  Debug: native/Identity.xcconfig
  Release: native/Identity.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: native/Shared/tl_core.h
    OTHER_LDFLAGS: -ltl_core
    LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: TwimShelf
    # GitHub builds pass TL_UPDATE_REPO=owner/name (检查更新); empty everywhere else = no update check
    TL_UPDATE_REPO: ""
    SWIFT_STRICT_CONCURRENCY: minimal
targetTemplates:
  # the icon: AppIcon (icon.png), or AppIconLocal when config.local.yaml names an icon of your own
  # (on each target: XcodeGen's presets set it per target)
  Icon:
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: $(TL_APP_ICON)
  App:
    templates: [Icon]
    dependencies:
      - { package: TLLocalAI }
    preBuildScripts: [{ name: Build Rust core, script: "\"$SRCROOT/scripts/build_core.sh\"", basedOnDependencyAnalysis: false }]
targets:
  TwimShelf-iOS:
    templates: [App]
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [native/Shared, native/iOS, native/Resources, native/ShareExtension/ShareCollector.swift, native/ShareExtension/ShareSheet.swift]
    # the share extension is always built; config.yaml decides whether it is signed and embedded
    dependencies: [{ target: TwimShelf-iOSShare, embed: true, codeSign: true }]
    settings:
      base:
        EXCLUDED_SOURCE_FILE_NAMES: $(TL_SHARE_EXCLUDE_IOS)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: $(TL_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).ios
        CODE_SIGN_ENTITLEMENTS: $(TL_IOS_ENTITLEMENTS)   # none without the share extension
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: native/iOS/Info.plist
      properties: &plist
        CFBundleDisplayName: TwimShelf
        TLAppGroup: $(TL_APP_GROUP_IOS)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLUpdateRepository: $(TL_UPDATE_REPO)
        UILaunchScreen: { UIColorName: "" }
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Used to find your other devices on the local network and sync the library with them directly.
        NSFaceIDUsageDescription: Used to unlock the app when the app lock is on.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: downloadPosts
            UIApplicationShortcutItemTitle: Download Posts
            UIApplicationShortcutItemIconSymbolName: arrow.down.circle
        NSBonjourServices: [_twlib._tcp]
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz grid zoom on ProMotion phones
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.twimshelf.tlpack
            UTTypeDescription: TwimShelf Export
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification: { public.filename-extension: [tlpack] }
        CFBundleDocumentTypes:
          - CFBundleTypeName: TwimShelf Export
            LSItemContentTypes: [org.twimshelf.tlpack]
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
  TwimShelf-macOS:
    templates: [App]
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [native/Shared, native/macOS, native/Resources, native/ShareExtension/ShareCollector.swift, native/ShareExtension/ShareSheet.swift]
    dependencies: [{ target: TwimShelf-macOSShare, embed: true, codeSign: true }]
    settings:
      configs:
        # debug builds are a separate app: own settings, keychain items and window frames,
        # so test runs never read or change the installed app's
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).mac.debug, TL_URL_SCHEME: twimshelf-debug }
      base:
        EXCLUDED_SOURCE_FILE_NAMES: $(TL_SHARE_EXCLUDE_MAC)
        PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).mac
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: $(TL_MAC_ENTITLEMENTS)   # none without the share extension
        TL_URL_SCHEME: twimshelf
        CODE_SIGN_STYLE: $(TL_MAC_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(TL_MAC_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(TL_TEAM)
    info:
      path: native/macOS/Info.plist
      properties:
        CFBundleDisplayName: TwimShelf
        TLAppGroup: $(TL_APP_GROUP_MAC)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLUpdateRepository: $(TL_UPDATE_REPO)
        LSApplicationCategoryType: public.app-category.photography
        CFBundleURLTypes:
          - CFBundleURLName: $(TL_BUNDLE_ID).share
            CFBundleURLSchemes: [$(TL_URL_SCHEME)]
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: Used to find your other devices on the local network and sync the library with them directly.
        NSBonjourServices: [_twlib._tcp, _twlib-debug._tcp]   # the debug build advertises its own type
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: org.twimshelf.tlpack
            UTTypeDescription: TwimShelf Export
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification: { public.filename-extension: [tlpack] }
        CFBundleDocumentTypes:
          - CFBundleTypeName: TwimShelf Export
            LSItemContentTypes: [org.twimshelf.tlpack]
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
  TwimShelf-iOSShare:
    templates: [Icon]
    type: app-extension
    platform: iOS
    preBuildScripts: [{ name: Build Rust core, script: "\"$SRCROOT/scripts/build_core.sh\"", basedOnDependencyAnalysis: false }]
    deploymentTarget: "18.0"
    sources: [native/ShareExtension/ShareCollector.swift, native/ShareExtension/ShareSheet.swift, native/ShareExtension/InfoPlist.xcstrings, native/ShareExtension/iOS, native/Shared/L10n.swift, native/Resources/Localizable.xcstrings, native/Resources/Assets.xcassets]   # the icon in the share menu
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: $(TL_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).ios.share
        PRODUCT_NAME: TwimShelfShare
        CODE_SIGNING_ALLOWED: $(TL_SHARE_SIGNING_IOS)
        CODE_SIGN_ENTITLEMENTS: native/ShareExtension/iOS/Share.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: native/ShareExtension/iOS/Info.plist
      properties:
        CFBundleDisplayName: Import to TwimShelf
        TLAppName: TwimShelf
        TLAppGroup: $(TL_APP_GROUP_IOS)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.folder" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count > 0).@count > 0'
  TwimShelf-macOSShare:
    templates: [Icon]
    type: app-extension
    platform: macOS
    preBuildScripts: [{ name: Build Rust core, script: "\"$SRCROOT/scripts/build_core.sh\"", basedOnDependencyAnalysis: false }]
    deploymentTarget: "15.0"
    sources: [native/ShareExtension/ShareCollector.swift, native/ShareExtension/ShareSheet.swift, native/ShareExtension/InfoPlist.xcstrings, native/ShareExtension/macOS, native/Shared/L10n.swift, native/Resources/Localizable.xcstrings, native/Resources/Assets.xcassets]   # the icon in the share menu
    settings:
      configs:
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).mac.debug.share, TL_URL_SCHEME: twimshelf-debug }
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).mac.share
        PRODUCT_NAME: TwimShelfShare
        CODE_SIGNING_ALLOWED: $(TL_SHARE_SIGNING_MAC)
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: native/ShareExtension/macOS/Share.entitlements
        TL_URL_SCHEME: twimshelf
        CODE_SIGN_STYLE: $(TL_MAC_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(TL_MAC_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(TL_TEAM)
        ENABLE_APP_SANDBOX: YES
    info:
      path: native/ShareExtension/macOS/Info.plist
      properties:
        CFBundleDisplayName: Import to TwimShelf
        TLAppName: TwimShelf
        TLAppGroup: $(TL_APP_GROUP_MAC)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        TLAppURLScheme: $(TL_URL_SCHEME)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.folder" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count > 0).@count > 0'
  TwimShelf-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [native/iOSUITests]
    dependencies: [{ target: TwimShelf-iOS }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TwimShelf-iOS
        PRODUCT_NAME: TwimShelfUITests
        PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).uitests
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # The grid zoom against Photos: 9 recorded pinches replayed frame by frame, and synthetic
  # gestures (research/MetalGridZoom/Tests). Run after any change to ZoomEngine / GridConfig.
  GridTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: native/GridTests
        excludes: [Fixtures]
      - native/Shared/Grid/GridConfig.swift
      - native/Shared/Grid/ZoomEngine.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TL_BUNDLE_ID).gridtests
        SWIFT_OPTIMIZATION_LEVEL: -O
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  TwimShelf-iOS:
    build:
      targets: { TwimShelf-iOS: all, TwimShelf-iOSUITests: [test] }
      # config.yaml first (names, ids, icons): Xcode reads the generated settings after this
      preActions:
        - script: python3 "$SRCROOT/scripts/apply.py" native
          settingsTarget: TwimShelf-iOS
    test: { targets: [TwimShelf-iOSUITests] }
  TwimShelf-macOS:
    build:
      targets: { TwimShelf-macOS: all }
      # config.yaml first (names, ids, icons): Xcode reads the generated settings after this
      preActions:
        - script: python3 "$SRCROOT/scripts/apply.py" native
          settingsTarget: TwimShelf-macOS
  GridTests:
    build: { targets: { GridTests: [test] } }
    test: { targets: [GridTests] }
