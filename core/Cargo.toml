[package]
name = "tl-core"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
futures-util = "0.3"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
libc = "0.2"
# LAN discovery for every front end (Bonjour-compatible mDNS, no runtime dependency)
mdns-sd = "0.21"
# this device's own subnets, to pick the address of a multi-homed peer that is reachable from here
if-addrs = "0.15"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
spake2 = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kamadak-exif = "0.6"
moxcms = "0.8"
# protected accounts (src/protected): X's URLs, blocking requests on worker threads
url = "2"

[features]
# HEIC and AVIF through libheif, for the Flutter app (scripts/flutter/build_core.sh, build.ps1)
heif = ["dep:cmake"]

[build-dependencies]
cmake = { version = "0.1", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dev-dependencies]
proptest = "1"
