<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TwimShelf</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div class="grow">
      <h1>TwimShelf</h1>
      <p id="summary" class="summary"></p>
    </div>
  </header>

  <!-- binding: shown by itself with no device, or under the devices after "Add" -->
  <section id="connect" class="card connect" hidden>
    <h2 id="connectTitle" data-i18n="connectTitle"></h2>
    <ol class="steps">
      <li data-i18n="stepOpen"></li>
      <li data-i18n="stepEnter"></li>
    </ol>
    <form id="bindForm" autocomplete="off">
      <input id="entry" class="entry" type="text" spellcheck="false" data-i18n-placeholder="entryPlaceholder" aria-describedby="bindStatus">
      <button id="bind" class="primary" type="submit" data-i18n="bind"></button>
    </form>
    <p id="bindStatus" class="status" role="status"></p>
    <div id="localBox" class="local" hidden>
      <span class="local-label" data-i18n="foundHere"></span>
      <div id="local" class="chips"></div>
    </div>
    <details id="addressBox">
      <summary data-i18n="manualTitle"></summary>
      <p class="hint" data-i18n="manualHint"></p>
      <input id="address" class="address" type="text" spellcheck="false" placeholder="192.168.1.5:27800 · server.local:2778">
    </details>
    <button id="cancelAdd" class="text" type="button" data-i18n="cancel" hidden></button>
  </section>

  <section id="devicesCard" class="card" hidden>
    <div class="card-head">
      <h2 data-i18n="devicesTitle"></h2>
      <button id="addToggle" class="text" type="button"><span aria-hidden="true">＋</span> <span data-i18n="addDevice"></span></button>
    </div>
    <ul id="devices" class="rows"></ul>
    <label id="defaultRow" class="default-row" hidden>
      <span data-i18n="defaultDevice"></span>
      <select id="defaultDevice"></select>
    </label>
  </section>

  <section id="tasksCard" class="card" hidden>
    <div class="card-head">
      <h2 data-i18n="tasksTitle"></h2>
      <button id="clear" class="text" type="button" data-i18n="clearFinished"></button>
    </div>
    <ul id="tasks" class="rows"></ul>
  </section>

  <p id="hintX" class="foot" data-i18n="howToUse" hidden></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
