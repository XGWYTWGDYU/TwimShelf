[package]
name = "tl-server"
version = "1.5.0"
edition = "2021"
description = "TwimShelf for a server (NAS, homelab): the core and the web app over HTTP"

[[bin]]
name = "twimshelf-server"
path = "src/main.rs"

[dependencies]
tl-core = { path = "../core" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
subtle = "2"
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rpassword = "7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[profile.release]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[features]
default = ["heif"]
# HEIC and AVIF (libheif, built from pinned sources by the core; needs CMake, Meson, Ninja, NASM)
heif = ["tl-core/heif"]
