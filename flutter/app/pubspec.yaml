name: twimshelf
description: "The Flutter app."
publish_to: 'none'
version: 2.0.0+13

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  tl_core:
    path: ../tl_core
  tl_native:
    path: ../tl_native
  tl_llama:
    path: ../tl_llama
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  unorm_dart: ^0.3.1
  characters: ^1.4.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  image: ^4.5.4
  audio_session: ^0.2.2
  ffi: ^2.1.4
  path: ^1.9.1
  mime: ^2.0.0
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  dynamic_color: ^1.7.0
  share_plus: ^13.3.1
  screen_brightness: ^2.1.11
  flutter_volume_controller: ^2.0.2
  visibility_detector: ^0.4.0+2
  package_info_plus: ^10.2.2
  local_auth: ^3.0.2
  quick_actions: ^1.1.1
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # test_driver/perf_driver.dart (the performance tests' results)
  flutter_driver:
    sdk: flutter
  # integration_test/transfer_flow_test.dart builds its own ZIP
  archive: ^4.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/ai/
    - assets/app_icon.png
