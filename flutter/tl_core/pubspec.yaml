name: tl_core
description: Typed Dart bindings for the TwimShelf Rust C API.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  ffi: ^2.1.3
  web: ^1.1.1
dev_dependencies:
  test: ^1.25.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
