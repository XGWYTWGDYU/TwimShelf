# 这个仓库的配置：Bundle ID 和包名、版本号、签名、分享扩展开关、构建位置。这里是公开的默认值。
# 代码里用到这些值的地方都引用这里。应用名称直接写在代码里；图标来自根目录的 icon.png。
#
# 自己电脑上的值（自己的 Bundle ID、团队、签名证书、分享扩展、构建位置、自己的图标）写在旁边的
# config.local.yaml 里，它不进 Git，读取时逐项覆盖这里（写法见 config.local.example.yaml）。
# 由这两个文件生成的文件（Xcode 工程、Identity.xcconfig 等）也都不进 Git。
#
# 改完之后不用手动做什么：./build.sh、build.ps1 和 Xcode 的构建按钮都会先按这里重新生成
# （scripts/apply.py）。新克隆下来、还没构建过时，先运行一次 ./build.sh --configure。

version: 1.5.2                # 所有平台共用的版本号；提高它并推送到 main，GitHub Actions 就会发布新版本
build_number: 8               # 每次发布递增（iOS 的 CFBundleVersion、Android 的 versionCode 都用它）

build:
  # 所有构建缓存和构建产物的位置：相对路径以项目根目录为准，也可以是任意绝对路径。
  # 不论用脚本、Xcode 还是 Flutter 构建：
  #   <dir>/cache  构建缓存（Rust、Xcode、Flutter、Gradle、CocoaPods、Dart 包、下载的 SDK、日志）
  #   <dir>/apps   安装包（dmg、ipa、apk、setup.exe、AppImage）
  dir: build

native:                       # 原生 iOS / iPadOS / macOS（native/Shared、native/iOS、native/macOS）
  bundle_id: org.twimshelf.release.b82168e857475   # iOS 用 <bundle_id>.ios，Mac 用 <bundle_id>.mac
  share_extension_ios: false  # iOS「分享到」：需要 development_team，且必须是付费开发者账号
  share_extension_mac: false  # Mac「分享」菜单：需要 development_team，免费账号也可以
  development_team: ""        # 留空：在 Xcode 里选自己的团队，或者写在这里（10 位 Team ID）
  mac_signing_identity: ""    # 留空：有团队时自动签名，没有团队时用临时签名（ad-hoc）

flutter:                      # Flutter 版（flutter/app）：Android、Windows、Linux、iOS、macOS
  apple_bundle_id: org.twimshelf.flutter.a426e3d2bf2bc7   # Flutter 的 iOS / macOS 版
  android_package: org.twimshelf.android.a2024d4b106801   # Android 的 applicationId
  desktop_id: org.twimshelf.desktop.a394128ded6644        # Linux 的应用 ID（菜单项、图标名）
  share_extension: true       # Android「分享到」、Windows「发送到」、Linux「打开方式」
  share_extension_ios: false  # iOS「分享到」：需要 development_team，且必须是付费开发者账号
  share_extension_mac: false  # Mac「分享」菜单：需要 development_team，免费账号也可以
  development_team: ""        # 留空：在 Xcode 里选自己的团队，或者写在这里（10 位 Team ID）
